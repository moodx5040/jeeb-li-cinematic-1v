<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشوارك | جيب لي</title><link rel="stylesheet" href="trips.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="nav"><a class="brand" href="index.html"><span class="mark">🚘</span><span><b>جيب لي</b><small>طلبك علينا وراحتك تهمنا</small></span></a><a class="back" href="index.html">← الرئيسية</a></header><main class="wrap"><section class="intro reveal"><span class="eyebrow">03 · RIDE REQUEST</span><h1>من هنا<br><em>إلى هناك.</em></h1><p>حدد نقطة البداية والوجهة، واكتب أي ملاحظة تساعدنا نفهم مشوارك.</p><div class="route-visual"><div class="route-line"></div><div class="pin start">●</div><div class="pin end">◆</div><div class="route-label one">نقطة الانطلاق</div><div class="route-label two">وجهتك</div><div class="car">🚘</div></div><div class="safety">✦ تفاصيل المشوار والسعر تُراجع وتُؤكد قبل اعتماد الخدمة.</div></section><section class="form-card reveal"><div class="head"><div><span>طلب مشوار</span><h2>وين نروح؟</h2></div><b>03 / 03</b></div><form id="tripForm"><div class="two"><label>اسمك<input name="name" required minlength="2" placeholder="الاسم الكريم"></label><label>رقم جوالك<input name="phone" required type="tel" pattern="05[0-9]{8}" placeholder="05xxxxxxxx"></label></div><label>موقع الانطلاق<input name="from" id="from" required placeholder="رابط الموقع أو وصف واضح"></label><button class="loc" type="button" id="getLocation">📍 استخدم موقعي كنقطة انطلاق</button><label>الوجهة<input name="to" required placeholder="إلى أين؟"></label><label>موعد المشوار <small>اختياري</small><input name="time" placeholder="الآن / الساعة ..."></label><label>ملاحظات <small>اختياري</small><textarea name="notes" placeholder="عدد الركاب أو أي تفاصيل مهمة"></textarea></label><button class="submit" type="submit">جهّز المشوار على واتساب <span>↗</span></button><p class="fine">ستفتح رسالة جاهزة لتراجعها وتؤكدها بنفسك.</p></form></section></main><div class="toast" id="toast"></div><script src="trips.js"></script></body></html>
