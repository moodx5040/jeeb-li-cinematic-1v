<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشوارك | جيب لي</title><link rel="icon" href="assets/icons/jeeb-mark.svg"><link rel="stylesheet" href="trips.css"></head><body><header class="nav"><a class="brand" href="index.html"><img src="assets/icons/jeeb-mark.svg" alt=""><span><b>جيب لي</b><small>طلبك علينا وراحتك تهمنا</small></span></a><a class="back" href="index.html">← الرئيسية</a></header><main class="wrap"><section class="intro reveal"><span class="eyebrow">03 · RIDE REQUEST</span><h1>من هنا<br><em>إلى هناك.</em></h1><p>حدد نقطة البداية والوجهة، واكتب أي ملاحظة تساعدنا نفهم مشوارك.</p><div class="route-visual"><div class="route-line"></div><div class="pin start">A</div><div class="pin end">B</div><div class="route-label one">نقطة الانطلاق</div><div class="route-label two">وجهتك</div><div class="car"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 24h3l4-11h15l5 11h2a2 2 0 0 1 2 2v6h-5M8 32H5v-6a2 2 0 0 1 2-2h27M14 32h12"/><circle cx="11" cy="32" r="3"/><circle cx="29" cy="32" r="3"/><path d="M14 17h12l3 7H11l3-7Z"/></svg></div></div><div class="safety">تفاصيل المشوار والسعر تُراجع وتُؤكد قبل اعتماد الخدمة.</div></section><section class="form-card reveal"><div class="head"><div><span>طلب مشوار</span><h2>وين نروح؟</h2></div><b>03 / 03</b></div><form id="tripForm"><div class="two"><label>اسمك<input name="name" required minlength="2" placeholder="الاسم الكريم" autocomplete="name"></label><label>رقم جوالك<input name="phone" required type="tel" pattern="05[0-9]{8}" inputmode="numeric" placeholder="05xxxxxxxx" autocomplete="tel"></label></div><label>موقع الانطلاق<input name="from" id="from" required placeholder="رابط الموقع أو وصف واضح"></label><button class="loc" type="button" id="getLocation">استخدم موقعي كنقطة انطلاق</button><label>الوجهة<input name="to" required placeholder="إلى أين؟"></label><label>موعد المشوار <small>اختياري</small><input name="time" placeholder="الآن / الساعة ..."></label><label>ملاحظات <small>اختياري</small><textarea name="notes" placeholder="عدد الركاب أو أي تفاصيل مهمة"></textarea></label><button class="submit" type="submit">جهّز المشوار على واتساب <span>↗</span></button><p class="fine">ستفتح رسالة جاهزة لتراجعها وتؤكدها بنفسك.</p></form></section></main><div class="toast" id="toast"></div><script src="cinematic.js"></script><script src="trips.js"></script></body></html>
